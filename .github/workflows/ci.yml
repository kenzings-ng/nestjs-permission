name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm test -- --coverage

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify package contents
        run: npm pack --dry-run

  compatibility:
    name: Node ${{ matrix.node }} / NestJS ${{ matrix.nest }} / Mongoose ${{ matrix.mongoose }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 18.x
            nest: 10
            nest_mongoose: 10
            mongoose: 8
          - node: 20.19.x
            nest: 11
            nest_mongoose: 11
            mongoose: 9
          - node: 22.x
            nest: 11
            nest_mongoose: 11
            mongoose: 9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install toolchain dependencies
        run: npm ci --ignore-scripts

      - name: Install supported peer versions
        run: >-
          npm install --no-save --package-lock=false
          @nestjs/common@${{ matrix.nest }}
          @nestjs/core@${{ matrix.nest }}
          @nestjs/testing@${{ matrix.nest }}
          @nestjs/mongoose@${{ matrix.nest_mongoose }}
          mongoose@${{ matrix.mongoose }}

      - name: Report resolved peer versions
        run: >-
          node -e "for (const name of ['@nestjs/common', '@nestjs/core', '@nestjs/testing',
          '@nestjs/mongoose', 'mongoose']) console.log(name, require(name + '/package.json').version)"

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
